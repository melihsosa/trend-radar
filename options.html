<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Trend Radar · Ayarlar</title>
<style>
  :root { --ground:#F6F4EF; --card:#FFFFFF; --ink:#17161A; --muted:#5E5A52; --line:#D8D3C8; --ok:#0B6B42; --bad:#A8321C; }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#1A1917; --card:#23221F; --ink:#F2EFE8; --muted:#A8A399; --line:#3A3833; --ok:#4CC38A; --bad:#F07A62; }
  }
  body { margin:0; background:var(--ground); color:var(--ink); font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif; }
  main { max-width:560px; margin:48px auto; padding:0 16px; }
  h1 { font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif; font-size:26px; margin:0 0 6px; }
  p { color:var(--muted); margin:0 0 24px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:16px; }
  label { display:flex; flex-direction:column; gap:6px; font-weight:600; font-size:14px; }
  small { font-weight:400; color:var(--muted); }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--ground); color:var(--ink); }
  .actions { display:flex; align-items:center; gap:12px; }
  button { font:inherit; font-weight:600; padding:10px 18px; border-radius:8px; border:0; background:var(--ink); color:var(--ground); cursor:pointer; min-height:44px; }
  #msg.ok { color:var(--ok); } #msg.bad { color:var(--bad); }
  details { margin-top:4px; } summary { cursor:pointer; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Trend Radar ayarları</h1>
  <p>Eklentinin günlük raporu hangi GitHub deposundan okuyacağını yaz.</p>
  <form id="form">
    <label>GitHub kullanıcı adın
      <input id="ghUser" autocomplete="off" placeholder="ornek: melihsosa" required>
    </label>
    <label>Depo (repo) adı
      <input id="ghRepo" autocomplete="off" placeholder="trend-radar" required>
    </label>
    <details>
      <summary>Gelişmiş: tam adres kullan</summary>
      <label style="margin-top:10px">Veri adresi
        <small>Doluysa yukarıdaki iki alanın yerine bu kullanılır.</small>
        <input id="dataUrl" autocomplete="off" placeholder="https://raw.githubusercontent.com/.../data/latest.json">
      </label>
    </details>
    <div class="actions">
      <button type="submit">Kaydet ve test et</button>
      <span id="msg" role="status"></span>
    </div>
  </form>
</main>
<script src="options.js"></script>
</body>
</html>
