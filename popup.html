<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Trend Radar</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg>
    </div>
    <div class="title">
      <div class="name">Trend Radar</div>
      <div class="sub" id="subtitle">Yükleniyor…</div>
    </div>
    <button class="icon-btn" id="settings" aria-label="Ayarlar" title="Ayarlar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="icon-btn" id="refresh" aria-label="Yenile" title="Yenile">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="pager">
    <div class="labels">
      <div id="labelA" class="on">Talep Borsası</div>
      <div id="labelB">İnternette Gündem</div>
    </div>
    <div class="rail"><div class="bar" id="bar"></div></div>
    <div class="hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Geçmek için sağa veya sola kaydır</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="viewport" id="viewport">
    <div class="track" id="track">
      <section class="panel" aria-label="Talep Borsası">
        <div class="panel-head">
          <div class="eyebrow" id="eyebrowA">Haftalık talep · Google</div>
          <div class="pill muted" id="badgeA" hidden>Örnek veri</div>
        </div>
        <div class="scroll" id="products"></div>
      </section>
      <section class="panel" aria-label="İnternette Gündem">
        <div class="panel-head">
          <div class="eyebrow" id="eyebrowB">Yapay zekanın seçtiği akımlar</div>
          <div class="pill muted" id="badgeB" hidden>Örnek veri</div>
        </div>
        <div class="scroll cards" id="trends"></div>
      </section>
    </div>
  </div>

  <footer class="foot">
    <div class="sources" id="sources"></div>
    <span id="updated"></span>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
